[versions]
microej-sdk = "1.0.0"
pack-ui = "13.3.1"

[libraries]
# APIs
api-bon =               { group = "ej.api", name = "bon", version = "1.4.3" }
api-device =            { group = "ej.api", name = "device", version = "1.2.0" }
api-drawing =           { group = "ej.api", name = "drawing", version = "1.0.5" }
api-edc =               { group = "ej.api", name = "edc", version = "1.3.7" }
api-ecom-network =      { group = "ej.api", name = "ecom-network", version = "2.1.1" }
api-ecom-wifi =         { group = "ej.api", name = "ecom-wifi", version = "2.2.1" }
api-kf =                { group = "ej.api", name = "kf", version = "1.7.0" }
api-microui =           { group = "ej.api", name = "microui", version = "3.5.0" }
api-net =               { group = "ej.api", name = "net", version = "1.1.2" }
api-security =          { group = "ej.api", name = "security", version = "1.7.0" }
api-sni =               { group = "ej.api", name = "sni", version = "1.4.4" }
api-ssl =               { group = "ej.api", name = "ssl", version = "2.2.1" }
api-trace =             { group = "ej.api", name = "trace", version = "1.1.1" }

# Architecture
architecture = { group = "com.microej.architecture.CM4.CM4hardfp_GCC48", name = "flopi4G25", version = "8.1.0" }

# Packs
pack-ui-architecture =  { group = "com.microej.architecture.CM4.CM4hardfp_GCC48", name = "flopi4G25-ui-pack", version.ref = "pack-ui" }
pack-device =           { group = "com.microej.pack.device", name = "device-pack", version = "1.2.0" }
pack-ecom-network =     { group = "com.microej.pack.ecom-network", name = "ecom-network-pack", version = "1.0.0" }
pack-ecom-wifi =        { group = "com.microej.pack.ecom-wifi", name = "ecom-wifi-pack", version = "1.1.0" }
pack-net =              { group = "com.microej.pack.net", name = "net-pack", version = "11.2.0" }
pack-net-addons =       { group = "com.microej.pack", name = "net-addons", version = "2.5.3" }
pack-ui =               { group = "com.microej.pack.ui", name = "ui-pack", version.ref = "pack-ui" }

# Libraries
library-logging =       { group = "ej.library.eclasspath", name = "logging", version = "1.2.1" }
library-checkHelper =   { group = "com.is2t.libraries", name = "checkHelper", version = "1.3.0" }
library-mwt =           { group = "ej.library.ui", name = "mwt", version = "3.5.0" }
library-widget =        { group = "ej.library.ui", name = "widget", version = "5.2.1" }
library-basictool =     { group = "ej.library.runtime", name = "basictool", version = "1.5.0" }
frontpanel-framework =  { group = "ej.tool.frontpanel", name = "framework", version = "1.1.0" }
frontpanel-ui-widget =  { group = "ej.tool.frontpanel", name = "widget", version = "2.0.0" }

# Test Libraries
junit =             { group = "ej.library.test", name = "junit", version = "1.10.3" }
junit-platform =    { group = "org.junit.platform", name = "junit-platform-launcher", version = "1.8.2" }

# Testsuites
testsuite-ecom-wifi =           { group = "com.microej.pack.ecom-wifi", name = "ecom-wifi-2_1-testsuite", version = "0.1.0" }
testsuite-net =                 { group = "com.microej.pack.net", name = "net-1_1-testsuite", version = "4.1.2" }
testsuite-net-openjdk =         { group = "com.microej.pack.net", name = "net-1_1-testsuite-openjdk", version = "1.1.1" }
testsuite-net-wifi =            { group = "com.microej.pack.net", name = "net-1_1-testsuite-wifi", version = "2.1.1" }
testsuite-security =            { group = "com.microej.pack.net", name = "security-1_7-testsuite", version = "1.8.0" }
testsuite-ssl =                 { group = "com.microej.pack.net", name = "net-ssl-2_2-testsuite", version = "4.0.2" }
testsuite-ui =                  { group = "com.microej.pack.ui", name = "ui-testsuite", version = "1.8.1" }

